interface:
  display_name: "金蝶星空重度知识库"
  short_description: "面向星空产品层与星空业务场景插件开发的重度技能，先查星空证据，再按需补元数据与 BOS 机制。"
  default_prompt: "先判断是否属于星空业务场景。若问题只出现预算、绩效、报表、模板、编制方案、任务配置等与星瀚共享的业务词，而未明确产品，先追问用户要星瀚还是星空，不要直接按星空回答。只有出现预算管理、预算执行分析、可用预算余额、H5预算报表、工作流预算控制等更强星空证据时，才直接按星空处理。普通问答只读取星空帮助中心索引；只有用户明确要写插件或确认表单、字段、按钮、单据体标识时，才读取星空元数据索引。若需要 BOS 接口或事件机制，再按需参考苍穹官方开发文档补足，不要把整道问题直接改判成纯苍穹问题。"
