interface:
  display_name: "金蝶星瀚重度知识库"
  short_description: "面向星瀚产品层与星瀚业务场景插件开发的重度技能，先查星瀚证据，再按需补元数据与 BOS 机制。"
  default_prompt: "先判断是否属于星瀚业务场景。若问题只出现预算、绩效、报表、模板、编制方案、任务配置等与星空共享的业务词，而未明确产品，先追问用户要星瀚还是星空，不要直接按星瀚回答。只有出现企业绩效云、目标绩效、EPM客户端等更强星瀚证据时，才直接按星瀚处理。普通问答只读取星瀚帮助中心索引；只有用户明确要写插件或确认表单、字段、按钮、单据体标识时，才读取星瀚元数据索引。若需要 BOS 接口或事件机制，再按需参考苍穹官方开发文档补足，不要把整道问题直接改判成纯苍穹问题。"
